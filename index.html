<html lang="pt-PT">

<title>Para Catarina Cunha | Operação Sorriso</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--ink:#453b59;--pink:#ff739a;--violet:#a889e7;--yellow:#ffda7a;--mint:#91e6c7;--bg:#fff8e9;--white:#fff;--shadow:0 14px 38px #654c7430}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#ffe5ef 0,transparent 42%),radial-gradient(ellipse at right bottom,#d7fff3 0,transparent 45%),var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8054c4;outline-offset:3px}.decor{position:fixed;pointer-events:none;opacity:.6;z-index:-1;font-size:34px;animation:float 6s ease-in-out infinite}.decor.a{top:10%;left:3%}.decor.b{top:20%;right:4%;animation-delay:-2s}.decor.c{bottom:10%;left:6%;animation-delay:-4s}.wrap{max-width:790px;margin:auto;padding:26px 16px 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:14px;font-weight:900;letter-spacing:.08em;color:#8b64ad}.music{border:2px solid #e5d7f5;border-radius:99px;background:white;padding:8px 13px;color:var(--ink);font-weight:800}.progress{height:11px;background:#efdfed;border-radius:99px;overflow:hidden}.bar{height:100%;width:0%;background:linear-gradient(90deg,#fc739e,#b094ee);transition:width .5s}.card{background:#fffefb;border:3px solid #fff;outline:2px solid #f1e1d9;border-radius:28px;box-shadow:var(--shadow);padding:clamp(20px,5vw,42px);margin-top:22px;position:relative;overflow:hidden}.eyebrow{color:#9877b9;font-size:12px;letter-spacing:.16em;font-weight:900;text-transform:uppercase}.title{font-size:clamp(31px,6vw,48px);line-height:1.1;margin:10px 0 16px;font-weight:900}.subtitle{font-size:17px;line-height:1.65;max-width:620px}.hero{font-size:clamp(70px,15vw,114px);text-align:center;filter:drop-shadow(0 10px 6px #b7a3ba30);margin:10px 0;animation:bob 3s ease-in-out infinite}.btn{border:0;background:var(--pink);color:#fff;border-radius:16px;font-weight:900;padding:14px 22px;box-shadow:0 7px 0 #db527c;min-height:52px;transition:transform .12s,box-shadow .12s}.btn:hover{filter:brightness(1.04)}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #db527c}.btn.alt{background:var(--violet);box-shadow:0 7px 0 #8567c5}.btn.light{background:#fff0f5;color:#7c4966;box-shadow:0 6px 0 #eacbd9}.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.hint{font-size:13px;color:#82738c;margin-top:18px}.steptext{background:#faf3ff;border-radius:14px;padding:12px 15px;font-weight:800;margin:16px 0;color:#735c95}.game-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}.tile{background:#fff0e4;border:2px solid #f5dbc5;border-radius:18px;min-height:105px;font-size:50px;display:grid;place-items:center;transition:transform .16s,background .16s;position:relative}.tile:hover{transform:translateY(-3px)}.tile.found{background:#d6f8e8;border-color:#9addbd}.tile.found:after{content:'✓';position:absolute;right:9px;top:5px;font-size:18px;color:#39916b;font-weight:900}.tile:disabled{cursor:default}.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.option{border:2px solid #edd9f4;border-radius:17px;background:#fdf6ff;padding:18px 10px;min-height:88px;text-align:center;font-weight:900;color:#58436c}.option .emoji{display:block;font-size:37px;margin-bottom:5px}.option.correct{background:#dcfff0;border-color:#72cfa8}.option.wrong{background:#ffe6e5;border-color:#f2a6a1}.scene{display:flex;justify-content:center;gap:20px;align-items:center;margin:20px auto;font-size:clamp(47px,12vw,86px)}.stickerbox{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.sticker{border-radius:100px;background:#fff1cf;border:2px dashed #f8d878;padding:8px 12px;font-weight:900}.note{background:#fff1cc;padding:20px;border-radius:18px;transform:rotate(-1deg);box-shadow:0 6px 0 #ffe1a1;font-size:17px;line-height:1.65}.final{background:linear-gradient(150deg,#fff7ee,#ffe9f4 65%,#e7fff5);border-radius:20px;padding:20px}.letter{background:white;padding:24px;border-radius:16px;line-height:1.85;font-size:17px;border:1px solid #f3d9e2;box-shadow:0 8px 23px #9965841e}.letter strong{color:#e35189}.heart{font-size:76px;text-align:center;animation:beat 1.2s infinite}.count{font-weight:900;font-size:15px;color:#926aaf}.hidden{display:none!important}.reveal{animation:rise .4s ease-out}.tiny{font-size:13px;opacity:.8}.footer{text-align:center;font-size:12px;margin-top:23px;color:#988aa0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9;background:#554667;color:white;font-weight:800;border-radius:16px;padding:12px 18px;box-shadow:var(--shadow);max-width:90vw;text-align:center;display:none}.toast.show{display:block;animation:rise .2s}.confetti{position:fixed;top:-30px;pointer-events:none;z-index:20;animation:fall var(--dur) linear forwards;font-size:25px}.name-box{border:2px solid #eedff1;border-radius:12px;padding:12px 16px;width:100%;max-width:290px;background:#fff;font-weight:800;color:var(--ink)}@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}@keyframes beat{50%{transform:scale(1.14)}}@keyframes float{50%{transform:translateY(-20px) rotate(8deg)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:.7}}@media(max-width:520px){.wrap{padding:15px 12px 40px}.card{border-radius:22px;padding:24px 17px}.quiz-options{grid-template-columns:1fr 1fr}.tile{min-height:88px;font-size:40px}.subtitle{font-size:16px}.buttons .btn{flex:1}}

/* Edição editorial: neutros quentes, verde-sálvia e terracota discreta */
:root{--ink:#303933;--pink:#a66258;--violet:#718275;--yellow:#d7c5a5;--mint:#aab8a8;--bg:#f5f2ec;--white:#fffdf9;--shadow:0 14px 36px rgba(45,48,42,.075)}
body{background:linear-gradient(160deg,#f8f6f1 0%,#f2f0e9 55%,#eaece6 100%);color:var(--ink)}
.brand{color:#607165;font-size:12px;letter-spacing:.13em}
.decor{color:#a8b4a5;opacity:.16;font-size:42px;animation:none}
.music{border:1px solid #d9dfd5;background:#fafbf7;font-weight:700}
.progress{height:6px;background:#e1e4db}
.bar{background:#778d7b}
.card{background:#fffdf9;border:1px solid #e0e3d9;outline:none;border-radius:22px;box-shadow:var(--shadow)}
.eyebrow{color:#788a79;font-size:11px}
.title{font-weight:800;letter-spacing:-.035em}
.subtitle{color:#4c5b52}
.hero{filter:none;animation:bob 5s ease-in-out infinite;font-size:clamp(54px,12vw,85px)}
.btn{background:#657f6b;box-shadow:0 4px 0 #425d48;border-radius:12px;font-weight:800}
.btn:active{box-shadow:0 1px 0 #425d48;transform:translateY(3px)}
.btn.alt{background:#9f7469;box-shadow:0 4px 0 #755047}
.btn.light{background:#edf0e9;box-shadow:0 4px 0 #d5dbd0;color:#3d5245}
.steptext{background:#f1f3ed;color:#536b58;border:1px solid #e2e8df;font-weight:700}
.tile{background:#f6f3eb;border:1px solid #e6dfd3;border-radius:14px}
.tile.found{background:#e9f1e7;border-color:#a7bda6}
.tile.found:after{color:#4d7655}
.option{border:1px solid #d8ddd3;border-radius:13px;background:#f7f8f4;color:#405246;font-weight:800}
.option.correct{background:#e9f1e8;border-color:#9db69d}
.option.wrong{background:#f7eeea;border-color:#c9aea6}
.note{background:#f7f2e5;box-shadow:0 3px 0 #e5deca;transform:none;border:1px solid #e9e0cc}
.final{background:#f2f3ed;border:1px solid #dfe5da}
.letter{border:1px solid #e4e8de;box-shadow:0 5px 20px #3a55400b}
.letter strong{color:#8c5f52}
.sticker{background:#e9eee6;border:1px solid #cad6c6;color:#526756}
.count{color:#5d7865}
.footer{color:#829087}
.toast{background:#3f5648}
.name-box{border-color:#dce2d8}
button:focus-visible,input:focus-visible{outline:3px solid #7c927e}
@media (prefers-reduced-motion:reduce){.hero,.heart,.confetti{animation:none}}

/* Dois desafios extra: memória e rotina — estética sóbria */
.memory-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:22px 0}
.memory-tile{aspect-ratio: .82;border:1px solid #c9d4c8;background:#e9eee6;border-radius:13px;color:#47614d;font-weight:900;font-size:clamp(25px,5vw,40px);display:grid;place-items:center;transition:transform .15s,background .15s;min-width:0}
.memory-tile.open,.memory-tile.matched{background:#fffdf8;border-color:#aac0a8;transform:translateY(-2px)}
.memory-tile.matched{background:#e4eee2;opacity:.78}
.routine-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.routine-choice{background:#f6f7f1;color:#3d5245;border:1px solid #cbd7cb;border-radius:13px;padding:15px 10px;min-height:76px;font-weight:800;line-height:1.35}
.routine-choice:hover{background:#e9efe6}.routine-choice:disabled{opacity:.48;cursor:default}
.routine-choice.bad{background:#f7e7e2;border-color:#cba9a1}
.routine-done{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.routine-chip{font-size:13px;padding:7px 10px;background:#e8eee5;border:1px solid #c8d6c5;border-radius:40px;font-weight:800}
@media(max-width:520px){.memory-grid{gap:6px}.memory-tile{border-radius:9px}.routine-options{gap:8px}}
</style>
</head>
<body>
<div class="decor a">✳</div><div class="decor b">✦</div><div class="decor c">✳</div>
<main class="wrap"><div class="top"><div class="brand">✳ JARDIM DAS COISAS BONITAS</div><button id="sound" class="music" aria-label="Ativar ou desativar sons">🔈 Som desligado</button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="card reveal" id="card" aria-live="polite"></div><div class="footer">Feito para a Catarina, com carinho, humor e zero fichas para corrigir. ♡</div></main><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const para=safe(params.get('para')||'Catarina Cunha');const de=safe(params.get('de')||'o teu namorado');let stage=0,found=new Set(),answers=[],sound=false,audioCtx=null;const card=$('card');function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2400)}function beep(note=500){if(!sound)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=note;g.gain.value=.04;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.11)}catch{}}$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Som ligado':'🔈 Som desligado';beep(650)};function next(n){stage=n;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){ $('bar').style.width=(stage/6*100)+'%';card.classList.remove('reveal');void card.offsetWidth;card.classList.add('reveal');if(stage===0)welcome();else if(stage===1)mess();else if(stage===2)quiz();else if(stage===3)craft();else if(stage===4)memoryGame();else if(stage===5)routineGame();else finish()}function welcome(){card.innerHTML=`<div class="eyebrow">Transmissão do jardim de infância · nível 1</div><div class="hero">🏫 🧸</div><h1 class="title">Operação: Salvar o Sorriso</h1><p class="subtitle">Atenção, <strong>${para}</strong>! A sala do jardim de infância entrou em modo <em>caos fofinho</em>. Há brinquedos perdidos, respostas inesperadas e uma surpresa preparada pelo teu namorado — que aparentemente também precisava de supervisão.</p><div class="steptext">🎮 Dificuldade: divertida · Tempo: 5 minutos · Paciência necessária: a de uma educadora de infância</div><div class="buttons"><button class="btn" id="start">Entrar no jardim →</button></div><p class="hint">Sem passwords, sem cronómetros e sem perder vidas. Podes jogar no telemóvel.</p>`;$('start').onclick=()=>next(1)}const toys=['🧸','🖍️','🦄','🚗','🧩','🐸','🪁','🪀','🎨'];const targets=[0,3,6];function mess(){card.innerHTML=`<div class="eyebrow">Missão 1 de 5 · arrumar o caos</div><h1 class="title">Quem espalhou os brinquedos?!</h1><p class="subtitle">O Martim garante que foi o dinossauro invisível. A Leonor diz que os brinquedos estavam a fazer uma festa. Encontra <strong>o ursinho, o carrinho e o papagaio</strong> para salvar o recreio.</p><div class="steptext">Procura: 🧸 + 🚗 + 🪁</div><div class="game-grid">${toys.map((t,i)=>`<button class="tile ${found.has(i)?'found':''}" data-toy="${i}" ${found.has(i)?'disabled':''} aria-label="Brinquedo ${i+1}">${t}</button>`).join('')}</div><p class="count" id="count">Brinquedos encontrados: ${found.size}/3</p><div class="buttons"><button class="btn ${found.size===3?'':'hidden'}" id="advance">Missão cumprida! →</button></div>`;card.querySelectorAll('[data-toy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.toy;if(targets.includes(i)){found.add(i);b.classList.add('found');b.disabled=true;beep(550+found.size*100);$('count').textContent=`Brinquedos encontrados: ${found.size}/3`;if(found.size===3){$('advance').classList.remove('hidden');toast('O recreio foi salvo! A paz durou 4 segundos.')}}else{beep(190);toast(['A girafa diz que não é esse!','Isso pertence ao museu do caos.','Quase! O Martim aplaudiu na mesma.'][Math.floor(Math.random()*3)])}});$('advance').onclick=()=>next(2)}const questions=[{q:'Uma criança pergunta: “Se as nuvens são algodão-doce, porque é que chove?” Qual é a melhor resposta?',a:[['Porque os unicórnios as espremem 🦄',1],['Está no regulamento interno 📋',0]],after:'Resposta cientificamente duvidosa, mas com imaginação de sobra.'},{q:'Faltam 30 segundos para sair e alguém anuncia: “Tenho xixi!” O que fazes?',a:[['Ativo o modo ninja da educadora 🥷',1],['Desapareço atrás de um armário 🫣',0]],after:'Desbloqueaste a competência lendária: resolver 12 coisas ao mesmo tempo.'},{q:'Uma criança oferece-te um desenho com 18 olhos e diz: “És tu!” Como reages?',a:[['É a minha melhor fotografia! 🖼️',1],['Peço um retrato com menos olhos 👀',0]],after:'Parabéns, ganhaste uma obra de arte que vale um milhão de sorrisos.'}];let qi=0;function quiz(){const q=questions[qi];card.innerHTML=`<div class="eyebrow">Missão 2 de 5 · exame de educadora</div><h1 class="title">Diploma em paciência infinita</h1><p class="subtitle">Pergunta ${qi+1} de ${questions.length}. Não há respostas erradas: só histórias para contar ao fim do dia.</p><div class="scene">👧 🧒 👩‍🏫</div><div class="steptext">${q.q}</div><div class="quiz-options">${q.a.map((a,i)=>`<button class="option" data-answer="${i}">${a[0]}</button>`).join('')}</div><p id="reaction" class="note hidden"></p><div class="buttons"><button id="quiznext" class="btn hidden">Continuar →</button></div>`;card.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let i=+b.dataset.answer;answers.push(i);card.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);b.classList.add('correct');$('reaction').textContent=q.after;$('reaction').classList.remove('hidden');$('quiznext').classList.remove('hidden');beep(620)});$('quiznext').onclick=()=>{qi++;qi<questions.length?quiz():next(3)}}function craft(){card.innerHTML=`<div class="eyebrow">Missão 3 de 5 · oficina de afetos</div><h1 class="title">Escolher o superpoder</h1><p class="subtitle">Para criar um dia mesmo especial, a turma precisa de escolher <strong>um superpoder</strong>. Qual destes é mais importante?</p><div class="quiz-options"><button class="option" data-power="riso"><span class="emoji">😂</span>Fazer rir nos dias difíceis</button><button class="option" data-power="abraco"><span class="emoji">🫂</span>Dar abraços que curam tudo</button><button class="option" data-power="magia"><span class="emoji">✨</span>Transformar dias normais em magia</button><button class="option" data-power="cafe"><span class="emoji">☕</span>Ter café infinito (essencial!)</button></div><div class="note hidden" id="powernote"></div><div class="buttons"><button class="btn hidden" id="end">Próximo desafio →</button></div>`;card.querySelectorAll('[data-power]').forEach(b=>b.onclick=()=>{card.querySelectorAll('[data-power]').forEach(x=>x.disabled=true);b.classList.add('correct');$('powernote').textContent='Escolha perfeita. A verdade é que já tens esse superpoder — e usas-o mais vezes do que imaginas.';$('powernote').classList.remove('hidden');$('end').classList.remove('hidden');beep(720)});$('end').onclick=()=>next(4)}
// ============================================================
// MISSÃO 4 — JOGO DA MEMÓRIA (5 pares)
// ============================================================
let memoryCards=[], memoryOpen=[], memoryMatched=new Set(), memoryBusy=false, memoryMoves=0;
const memorySymbols=['🧸','🎨','🧩','📚','🪁'];
function shuffle(arr){
    const out=[...arr];
    for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
    return out;
}
function resetMemory(){
    memoryCards=shuffle([...memorySymbols,...memorySymbols]);
    memoryOpen=[];memoryMatched.clear();memoryBusy=false;memoryMoves=0;
}
function memoryGame(){
    if(!memoryCards.length) resetMemory();
    card.innerHTML=`<div class="eyebrow">Missão 4 de 5 · ginástica para a memória</div>
    <h1 class="title">Onde estavam os pares?</h1>
    <p class="subtitle">A Catarina tem memória para mil nomes, casacos e garrafas de água. Mas e para <strong>cinco pares de desenhos</strong>? Vira duas cartas de cada vez e encontra os pares.</p>
    <div class="steptext">Encontra os 5 pares. Não há limite de tentativas.</div>
    <div class="memory-grid" id="memory-grid" aria-label="Jogo da memória">${memoryCards.map((_,i)=>`<button class="memory-tile" data-memory="${i}" aria-label="Carta ${i+1}, virada para baixo">?</button>`).join('')}</div>
    <p class="count" id="memory-count">Pares: 0/5 · Jogadas: 0</p>
    <div class="buttons"><button class="btn hidden" id="memory-next">Continuar a missão →</button><button class="btn light" id="memory-restart">Baralhar de novo ↻</button></div>`;
    const buttons=[...card.querySelectorAll('[data-memory]')];
    const update=()=>{
        buttons.forEach((b,i)=>{
            let show=memoryOpen.includes(i)||memoryMatched.has(i);
            b.textContent=show?memoryCards[i]:'?';
            b.classList.toggle('open',memoryOpen.includes(i));
            b.classList.toggle('matched',memoryMatched.has(i));
            b.disabled=memoryMatched.has(i);
            b.setAttribute('aria-label',show?`Carta ${i+1}: ${memoryCards[i]}`:`Carta ${i+1}: virada para baixo`);
        });
        $('memory-count').textContent=`Pares: ${memoryMatched.size/2}/5 · Jogadas: ${memoryMoves}`;
        if(memoryMatched.size===10){$('memory-next').classList.remove('hidden');toast('Memória lendária desbloqueada!');beep(750)}
    };
    buttons.forEach((b,i)=>b.onclick=()=>{
        if(memoryBusy||memoryMatched.has(i)||memoryOpen.includes(i)||memoryOpen.length>=2)return;
        memoryOpen.push(i);beep(490);update();
        if(memoryOpen.length===2){
            memoryMoves++;
            const [a,z]=memoryOpen;
            if(memoryCards[a]===memoryCards[z]){
                memoryMatched.add(a);memoryMatched.add(z);memoryOpen=[];beep(650);update();
            }else{
                memoryBusy=true;update();
                setTimeout(()=>{memoryOpen=[];memoryBusy=false;update()},850);
            }
        }
    });
    $('memory-restart').onclick=()=>{resetMemory();memoryGame()};
    $('memory-next').onclick=()=>next(5);
}
// ============================================================
// MISSÃO 5 — ORGANIZAR O DIA (puzzle sequencial)
// ============================================================
const routine=[
    {id:'receber',icon:'👋',label:'Receber as crianças',tip:'Primeiro chegam os pequenos exploradores.'},
    {id:'roda',icon:'📖',label:'História em roda',tip:'Depois de entrar, uma boa história junta a turma.'},
    {id:'brincar',icon:'🧩',label:'Brincar e descobrir',tip:'Agora é tempo de construir, descobrir e espalhar brinquedos.'},
    {id:'lanchar',icon:'🍎',label:'Lavar as mãos e lanchar',tip:'Antes de comer, as mãos precisam de uma visita à torneira.'},
    {id:'saida',icon:'🧥',label:'Despedidas e casacos',tip:'No fim, é hora de encontrar todos os casacos (boa sorte!).'}
];
let routineOrder=[], routineWrong=0, routineOptions=[];
function resetRoutine(){routineOrder=[];routineWrong=0;routineOptions=shuffle(routine.map(x=>x.id))}
function routineGame(){
    if(!routineOptions.length)resetRoutine();
    const target=routine[routineOrder.length];
    card.innerHTML=`<div class="eyebrow">Missão 5 de 5 · o dia em modo organizada</div>
    <h1 class="title">Missão: salvar a rotina!</h1>
    <p class="subtitle">Alguém baralhou o plano do dia. Ajuda a Catarina a colocar <strong>cinco momentos na ordem certa</strong>. As tentativas erradas dão pistas, por isso podes experimentar.</p>
    <div class="steptext" id="routine-instruction">${target?`Escolhe o passo ${routineOrder.length+1} de 5`:'Plano completo! Uma educadora aprovaria.'}</div>
    <div class="routine-done" id="routine-done">${routineOrder.map((id,i)=>{let x=routine.find(y=>y.id===id);return `<span class="routine-chip">${i+1}. ${x.icon} ${x.label}</span>`}).join('')||'<span class="tiny">Ainda não escolheste nenhum passo.</span>'}</div>
    <div class="routine-options" id="routine-options">${routineOptions.map(id=>{let x=routine.find(y=>y.id===id);return `<button class="routine-choice" data-routine="${id}" ${routineOrder.includes(id)?'disabled':''}>${x.icon} ${x.label}</button>`}).join('')}</div>
    <p class="count" id="routine-count">Passos completos: ${routineOrder.length}/5 · Tentativas: ${routineWrong}</p>
    <div class="buttons"><button class="btn ${routineOrder.length===5?'':'hidden'}" id="routine-next">Revelar a surpresa ♥</button><button class="btn light" id="routine-reset">Recomeçar o puzzle ↻</button></div>`;
    card.querySelectorAll('[data-routine]').forEach(b=>b.onclick=()=>{
        const id=b.dataset.routine, expected=routine[routineOrder.length];
        if(!expected)return;
        if(id===expected.id){
            routineOrder.push(id);beep(650);routineGame();
            if(routineOrder.length===5)toast('Dia organizado! Só falta a surpresa da Catarina.');
        }else{
            routineWrong++;b.classList.add('bad');
            $('routine-count').textContent=`Passos completos: ${routineOrder.length}/5 · Tentativas: ${routineWrong}`;
            toast(expected.tip);beep(210);
            setTimeout(()=>b.classList.remove('bad'),650);
        }
    });
    $('routine-reset').onclick=()=>{resetRoutine();routineGame()};
    $('routine-next').onclick=()=>next(6);
}
function confetti(){let icons=['✦','♡','✳','·','✧'];for(let i=0;i<35;i++){let e=document.createElement('div');e.className='confetti';e.textContent=icons[i%icons.length];e.style.left=Math.random()*100+'%';e.style.setProperty('--dur',(2+Math.random()*3)+'s');e.style.animationDelay=Math.random()*.7+'s';document.body.append(e);setTimeout(()=>e.remove(),5700)}}function finish(){card.innerHTML=`<div class="eyebrow">Missão concluída · presente desbloqueado</div><div class="heart">💖</div><h1 class="title" style="text-align:center">Catarina, esta surpresa é só tua.</h1><div class="final"><div class="letter"><p>Querida <strong>${para}</strong>,</p><p>Se há alguém capaz de transformar um dia de birras, histórias e brinquedos espalhados num dia bonito, és tu.</p><p>Adoro a forma como cuidas dos mais pequenos, a paciência que tens e esse teu jeito tão especial de fazer os outros sorrir.</p><p>Mas hoje a missão é diferente: <strong>és tu quem merece ser mimada.</strong></p><p>Depois de cinco missões (e de sobreviveres a uma rotina inteira), criei este joguinho para te roubar uns minutos, provocar-te umas gargalhadas e lembrar-te de uma coisa muito simples: <strong>adoro ser o teu namorado e gosto muito de ti.</strong></p><p>E se algum dia os pequenos gastarem toda a tua paciência, prometo tentar não gastar o que sobrar. (Não garanto nada.)</p><p>Um beijinho grande,<br><strong>${de}</strong> ❤️</p></div></div><div class="stickerbox"><span class="sticker">🏆 Educadora lendária</span><span class="sticker">✳ Criadora de sorrisos</span><span class="sticker">💗 Pessoa especial</span></div><div class="buttons"><button class="btn" id="again">Jogar outra vez ↻</button><button class="btn alt" id="copy">Copiar uma mensagem 💌</button></div><p class="hint">Podes personalizar o link com <code>?para=Nome&de=TeuNome</code>.</p>`;$('again').onclick=()=>{found.clear();qi=0;answers=[];memoryCards=[];resetRoutine();next(0)};$('copy').onclick=()=>{const msg=`Catarina, adoro ser o teu namorado. Fiz esta surpresa só para te ver sorrir. ❤️`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(msg).then(()=>toast('Mensagem copiada 💌')).catch(()=>fallbackCopy(msg))}else fallbackCopy(msg)};confetti()}function fallbackCopy(msg){let el=document.createElement('textarea');el.value=msg;document.body.append(el);el.select();try{document.execCommand('copy');toast('Mensagem copiada 💌')}catch{toast('Não foi possível copiar automaticamente')}el.remove()}render();})();
</script>
</body></html>
